<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单不存在</title>
<style>
body { font-family:-apple-system,sans-serif; background:#0A0A0A;
  color:#fff; display:flex; align-items:center; justify-content:center;
  min-height:100vh; margin:0; padding:20px; }
.box { text-align:center; background:#141414; padding:40px 30px;
  border-radius:20px; border:1px solid #1F1F1F; }
.icon { font-size:48px; margin-bottom:16px; }
.title { font-size:18px; font-weight:600; margin-bottom:8px; }
.desc { color:#888; font-size:14px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">⚠️</div>
  <div class="title" th:text="${error}">订单不存在</div>
  <div class="desc">请返回 App 重新发起充值</div>
</div>
</body>
</html>
